# dsh-plugin-vision —— bundle 补丁层。
# 作为「包内 bundle patch」分发时使用包名行（dsh plugin add 之后自动成为 profile 层）。
# 本机/开发态也可以把这段 insert 原样放进 profile 的 cordis.patch.yml，并把 name 换成
# 指向本仓库 index.js 的路径（见仓库 README 的「本地热装载」小节）。
- insert:
    - id: vision
      name: dsh-plugin-vision
      config:
        # 默认供应商。用户已有的 settings.yaml 会覆盖这里的值；这里只决定全新安装时的起点。
        # 选 dashscope 是因为它开箱支持图片/视频输入，且本机已在用的就是它。
        provider: dashscope
        apiKeyEnv: DASHSCOPE_API_KEY
